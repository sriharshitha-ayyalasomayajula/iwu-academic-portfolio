<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>IWU Academic Portfolio</title>
    <script>
      // GitHub Pages serves this file for unknown project-site paths.
      // pathSegmentsToKeep = 1 keeps the /iwu-academic-portfolio/ prefix.
      // Adapted from spa-github-pages (MIT): https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1
      var locationRef = window.location
      locationRef.replace(
        locationRef.protocol +
          '//' +
          locationRef.hostname +
          (locationRef.port ? ':' + locationRef.port : '') +
          locationRef.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          locationRef.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (locationRef.search ? '&' + locationRef.search.slice(1).replace(/&/g, '~and~') : '') +
          locationRef.hash,
      )
    </script>
  </head>
  <body>
    <p>Opening the portfolio page…</p>
  </body>
</html>
